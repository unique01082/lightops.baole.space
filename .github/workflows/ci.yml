name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm pretty:check
      - run: pnpm build:frontend
      - run: pnpm --dir src-landing lint
      - run: pnpm --dir src-landing build

  test-api:
    name: Sync API Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lightops
          POSTGRES_PASSWORD: lightops
          POSTGRES_DB: lightops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lightops -d lightops_test" --health-interval 5s --health-timeout 5s --health-retries 10


    env:
      DATABASE_URL: postgresql://lightops:lightops@127.0.0.1:5432/lightops_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lightops/api prisma:generate
      - run: pnpm --filter @lightops/api prisma:migrate
      - run: pnpm openapi:client
      - run: git diff --exit-code -- apps/api/openapi src/generated
      - run: pnpm --filter @lightops/api lint
      - run: pnpm --filter @lightops/api test
      - run: pnpm --filter @lightops/api build

  test-backend:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
