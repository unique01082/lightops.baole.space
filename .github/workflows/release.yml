name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: true,
              generate_release_notes: true
            });
            return data.id;

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: windows-latest
            args: '--target aarch64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Rust (macOS universal)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
      - name: Install Rust (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Download sidecar archive (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          LIGHTOPS_SIDECAR_URL: ${{ secrets.LIGHTOPS_SIDECAR_URL_MACOS_UNIVERSAL }}
        run: |
          test -n "$LIGHTOPS_SIDECAR_URL"
          rm -rf src-tauri/resources/bin
          mkdir -p src-tauri/resources/bin
          curl --fail --location --proto '=https' "$LIGHTOPS_SIDECAR_URL" -o sidecars.zip
          ditto -x -k sidecars.zip src-tauri/resources/bin
          chmod +x src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/exiftool src-tauri/resources/bin/jpegtran
      - name: Download sidecar archive (Windows x64)
        if: matrix.platform == 'windows-latest' && matrix.args == '--target x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          LIGHTOPS_SIDECAR_URL: ${{ secrets.LIGHTOPS_SIDECAR_URL_WINDOWS_X64 }}
        run: |
          if (-not $env:LIGHTOPS_SIDECAR_URL) { throw 'Missing sidecar URL' }
          Remove-Item src-tauri/resources/bin -Recurse -Force
          Invoke-WebRequest $env:LIGHTOPS_SIDECAR_URL -OutFile sidecars.zip
          Expand-Archive sidecars.zip src-tauri/resources/bin
      - name: Download sidecar archive (Windows ARM64)
        if: matrix.platform == 'windows-latest' && matrix.args == '--target aarch64-pc-windows-msvc'
        shell: pwsh
        env:
          LIGHTOPS_SIDECAR_URL: ${{ secrets.LIGHTOPS_SIDECAR_URL_WINDOWS_ARM64 }}
        run: |
          if (-not $env:LIGHTOPS_SIDECAR_URL) { throw 'Missing sidecar URL' }
          Remove-Item src-tauri/resources/bin -Recurse -Force
          Invoke-WebRequest $env:LIGHTOPS_SIDECAR_URL -OutFile sidecars.zip
          Expand-Archive sidecars.zip src-tauri/resources/bin
      - name: Verify sidecars and configure updater
        env:
          LIGHTOPS_SIDECAR_SHA256: ${{ matrix.platform == 'macos-latest' && secrets.LIGHTOPS_SIDECAR_SHA256_MACOS_UNIVERSAL || (matrix.args == '--target x86_64-pc-windows-msvc' && secrets.LIGHTOPS_SIDECAR_SHA256_WINDOWS_X64 || secrets.LIGHTOPS_SIDECAR_SHA256_WINDOWS_ARM64) }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-release.mjs
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false
            });
